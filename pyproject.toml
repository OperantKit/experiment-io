[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "experiment-io"
version = "0.0.0"
description = "Hardware abstraction layer for OperantKit experiment runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "OperantKit contributors" },
]
keywords = [
  "behavior-analysis",
  "operant-conditioning",
  "hardware-abstraction-layer",
  "experiment-runtime",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
hw-serial = [
  "pyserial>=3.5",
]
test = [
  "pytest>=8",
  "pytest-cov",
  "hypothesis>=6",
]
dev = [
  "experiment-io[test]",
  "mypy>=1.10",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/OperantKit"
Repository = "https://github.com/OperantKit/experiment-io"

[tool.hatch.build.targets.wheel]
packages = ["src/experiment_io"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "hw_serial: requires pyserial and actual hardware (skipped by default)",
  "hw_hil: requires HIL bridge endpoint (skipped by default)",
]

[tool.coverage.run]
branch = true
source = ["experiment_io"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RET"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
